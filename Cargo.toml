[package]
name = "ark-push"
version = "0.1.38"
edition = "2021"
description = "Ark-push: a Rust sidecar for LitePan (no Meilisearch required)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "gzip", "brotli", "deflate", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
base64 = "0.22"
regex = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
pinyin = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
mime_guess = "2"
url = "2"
urlencoding = "2"
percent-encoding = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
parking_lot = "0.12"
arc-swap = "1"
dashmap = "6"
subtle = "2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
